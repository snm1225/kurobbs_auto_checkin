name: Auto Checkin Job

on:
  schedule:
    # 每天早上 6 点北京时间（UTC+8）运行
    # UTC 时间 22:00 对应北京时间 6:00
    # 刻意与本地 21:30 的签到错开，避免同一账号两边同分钟互相判「请勿重复签到」
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  auto-sign:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安装依赖
      # tzdata 是给 ZoneInfo('Asia/Shanghai') 用的，runner 上不保证有系统时区数据
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行脚本并捕获输出
      # 注意：Token 的 Secret Name 必须叫 TOKEN，大小写完全一致
      - name: Run auto checkin script
        id: run_script
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN }}
          DEBUG: ${{ secrets.DEBUG }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          BARK_SERVER_URL: ${{ secrets.BARK_SERVER_URL }}
          SERVER3_SEND_KEY: ${{ secrets.SERVER3_SEND_KEY }} # ServerChan3
        run: |
          python auto_checkin.py
